[workspace]
members = [
    "bon",
    "coupesuite",
    "dessins",
    "edge",
    "etiquette",
    "formulaire",
    "liste",
    "shared",
    "publish",
]
resolver = "2"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
panic = "abort"

[profile.release.build-override]
codegen-units = 1
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
