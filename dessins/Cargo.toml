[package]
name = "coupesuite-dessins"
version = "1.3.0"
edition = "2021"
authors = ["Derek Sauer <dsauer@megalak.ca>"]
description = "Imprimez les dessins."
license = "MPL-2.0"

[[bin]]
name = "dessins"
path = "src/main.rs"

[lib]
name = "dessins"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.58"
coupesuite-shared = { path = "../shared" }
clap = { version = "3.2.6", features = ["derive"] }
tokio = { version = "1.19.2", features = ["fs", "macros", "rt"] }
serde = { version = "1.0.137", features = ["derive"] }
sqlx = { version = "0.6.0", features = ["runtime-tokio-rustls", "postgres"] }
tera = { version = "1.16.0", default-features = false }
tempfile = "3.3.0"
futures = "0.3.21"
