[package]
name = "coupesuite-shared"
version = "0.1.0"
edition = "2021"
authors = ["Derek Sauer <dsauer@megalak.ca>"]
description = "Fonctions communes à travers Coupésuite."
license = "MPL-2.0"

[dependencies]
anyhow = "1.0.58"
serde = { version = "1.0.137", features = ["derive"] }
toml = "0.5"
tokio = {version = "1.19.2", features = ["full"] }
sqlx = { version = "0.6.0", features = ["runtime-tokio-rustls", "postgres"] }
