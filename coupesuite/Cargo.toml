[package]
name = "coupesuite"
version = "1.3.5"
edition = "2021"
authors = ["Derek Sauer <dsauer@megalak.ca>"]
description = "Imprimer la documentation de production."
license = "MPL-2.0"
default-run = "coupesuite"

[[bin]]
name = "coupesuite"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.58"
coupesuite-shared = { path = "../shared" }
coupesuite-bon = { path = "../bon" }
coupesuite-dessins = { path = "../dessins" }
coupesuite-etiquette = { path = "../etiquette" }
coupesuite-formulaire = { path = "../formulaire" }
coupesuite-liste = { path = "../liste" }
clap = { version = "3.2.6", features = ["derive"] }
tokio = { version = "1.19.2", features = ["fs", "macros", "rt"] }
tempfile = "3.3.0"
serde = { version = "1.0.137", features = ["derive"] }
sqlx = { version = "0.6.0", features = ["runtime-tokio-rustls", "postgres"] }
