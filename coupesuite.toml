version = "0.2.0"

# Paramètres du générateur de listes de coupe
[liste]
v12_import_dir = "C:/V12/_WORK/IMPORT"  # Location du répertoire d'importation de Cutrite
default_bom_qty = 100                   # Quantité défaut lorsque la quantité n'est pas spécifiée.

# Paramètres de l'imprimante d'étiquettes.
[etiquette]
nom_imprimante = "Zebra (Bureau Derek)" # Trouver avec, `wmic printer get name`
multiple = 6                            # Nombre copies imprimées sera arrondi à ce multiple

# Paramètres d'impression du formulaire de production.
[formulaire]
nom_imprimante = "Back Office Printer"  # Trouver avec, `wmic printer get name`
copies_defaut = 1                       # Nombre de copies par défaut.
copies_mdf = 2                          # Nombre de copies par défaut pour les projets avec MDF.

# SIGM database
[database]
hostname = "192.168.0.20"
port = "5493"
name = "MFI"
username = "SIGM"

# Location d'un navigateur web `Chromium` pour la génération de PDF
[chromium]
location = "C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe"

# Location de `Ghostscript` pour l'impression des PDFs
[ghostscript]
location = "C:/Users/DSauer/scoop/apps/ghostscript/current/bin/gswin64c.exe"