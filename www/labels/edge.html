<!DOCTYPE html>

<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Etiquette plaqueues - {{ no_piece }}</title>
    <meta name="description" content="Autocollant du plaqueues robotisé." />
    <meta name="author" content="Megalak Finition Inc." />

    <link rel="stylesheet" href="{{ working_dir }}\www\normalize.css" />
    <link rel="stylesheet" href="{{ working_dir }}\www\labels\edge.css" />
  </head>

  <body>
    <div class="container">
      <div class="edge_top"><p class="rotate_top">{{ edge_haut }}</p></div>
      <div class="inner_container">
        <div class="edge_left"><p class="rotate_ccw">{{ edge_gauche }}</p></div>
        <div class="image_container">
          <img
            src="{{ datamatrix }}"
            alt="datamatrix"
            width="264"
            height="264"
          />
        </div>
        <div class="data_container">
          <div class="no_piece">{{ no_piece }}</div>
          <p>{{ desc_piece }}</p>
          <p>
            <b>Dims:</b> {{ longueur | round(precision=2) }} × {{ largeur |
            round(precision=2) }} × {{ epaisseur | round(precision=2) }}
          </p>
          <p><b>Faces laminées:</b> ?</p>
        </div>
        <div class="edge_right"><p class="rotate_cw">{{ edge_droite }}</p></div>
      </div>
      <div class="edge_bottom"><p>{{ edge_bas }}</p></div>
    </div>
  </body>
</html>
